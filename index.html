/* ---------- study plan before the next exam ---------- */
const PLAN_FOCUS = { mid: ['grammar', 'vocab', 'practice'], lr: ['reading', 'listening', 'practice'], quiz: ['practice', 'grammar', 'vocab'] };
const PLAN_AR = { grammar: 'القواعد', vocab: 'المفردات', practice: 'التمارين', reading: 'القراءة', listening: 'الاستماع', writing: 'الكتابة' };
const planFocus = e => e.focus || PLAN_FOCUS[e.kind] || PLAN_FOCUS.mid;
const planDesc = e => { const f = planFocus(e).map(k => PLAN_AR[k]); return f.length === 1 ? `${f[0]} فقط` : 'تركيز على ' + f.slice(0, -1).join(' و') + ' و' + f[f.length - 1]; };
function unitsText(e) {
  const u = (e.units || []).slice().sort((a, b) => a - b);
  if (!u.length) return 'كل الوحدات';
  if (u.length === 1) return `الوحدة ${u[0]}`;
  if (u.length === 2) return `الوحدتين ${u[0]} و${u[1]}`;
  return u.every((x, i) => !i || x === u[i - 1] + 1) ? `الوحدات من ${u[0]} إلى ${u[u.length - 1]}` : 'الوحدات ' + u.join(' و');
}
function examScope(e) { if (!e.units && !e.focus) return ''; return (e.focus && e.focus.length === 1 ? PLAN_AR[e.focus[0]] + ' · ' : '') + unitsText(e); }
function secAvg(s) { let sum = 0, n = 0; flat(s).forEach(b => { const r = Store.ex[b.id]; if (r && typeof r.b === 'number') { sum += r.b; n++; } }); return n ? Math.round(sum / n) : null; }
function planTaskDone(tk) {
  const L = UNITS.find(u => u.key === tk.key), s = L && L.sections.find(x => x.k === tk.sec);
  if (!s) return true;
  const st = secStats(s), avg = secAvg(s);
  return st.done >= st.total && (avg === null || avg >= 70);
}
function makePlan(e, sec) {
  const t = dayKey(), n = Math.max(0, bdDays(e.date));
  const kinds = planFocus(e);
  const tasks = [];
  UNITS.filter(L => L.part && (!e.units || e.units.includes(L.unit))).forEach(L => kinds.forEach(k => {
    if (!L.sections.some(s => s.k === k)) return;
    const tk = { key: L.key, sec: k }; if (!planTaskDone(tk)) tasks.push(tk);
  }));
  const days = [];
  if (n === 0) days.push({ d: t, t: [], rev: true });
  else {
    const studyDays = n >= 2 ? n - 1 : 1, per = Math.max(2, Math.ceil(tasks.length / studyDays));
    for (let i = 0; i < studyDays; i++) days.push({ d: dayAdd(t, i), t: tasks.slice(i * per, (i + 1) * per) });
    if (n >= 2) days.push({ d: dayAdd(t, n - 1), t: [], rev: true }); else days[0].rev = true;
  }
  return { id: e.id, sec, exam: e.date, units: (e.units || []).join(','), focus: planFocus(e).join(','), made: t, days };
}
function getPlan(e, sec) {
  let P = Store.mem.plan;
  if (!P || P.id !== e.id || P.sec !== sec || P.exam !== e.date || P.units !== (e.units || []).join(',') || P.focus !== planFocus(e).join(',')) { P = Store.mem.plan = makePlan(e, sec); Store.save(); }
  return P;
}
function planHTML(sec, nx) {
  if (!nx) return '';
  if (sec === 'all') return `<div class="plan pl-empty"><div class="pl-h">📋 خطة المذاكرة</div><div class="pl-s">اختاري شعبتك من فوق، ونجهّز لك خطة مذاكرة يوم بيوم لين اختبارك القادم، حسب الأجزاء اللي باقية عليك.</div></div>`;
  const P = getPlan(nx, sec), t = dayKey();
  const all = P.days.flatMap(d => d.t), doneN = all.filter(planTaskDone).length;
  const overdue = P.days.filter(d => d.d < t).flatMap(d => d.t).filter(x => !planTaskDone(x));
  const mockOn = d => (Store.mem.mockHist || []).some(x => dayKey(new Date(x.d)) === d);
  const chip = (tk, late) => {
    const L = UNITS.find(u => u.key === tk.key), S = SECS[tk.sec], ok = planTaskDone(tk);
    return `<a class="pl-t${ok ? ' ok' : ''}${late ? ' late' : ''}" href="#${tk.key}-${tk.sec}"><span class="ck">${ok ? '✓' : ''}</span><span class="en">${S.i} Unit ${L.short} · ${S.en}</span>${late ? '<small>متأخرة</small>' : ''}</a>`;
  };
  const lightDay = d => d.d !== t && !d.rev && !d.t.length;
  const groups = []; P.days.filter(d => d.d >= t).forEach(d => { const g = groups[groups.length - 1]; if (lightDay(d) && g && g.light) g.list.push(d); else groups.push({ light: lightDay(d), list: [d] }); });
  const rows = groups.map(g => {
    if (g.light && g.list.length > 1) { const a = g.list[0].d, b = g.list[g.list.length - 1].d; return `<div class="pl-day"><div class="pl-dd"><b>${arDays(g.list.length)}</b><span>${bdSlash(a)}</span><span>– ${bdSlash(b)}</span></div><div class="pl-ts"><div class="pl-light">أيام خفيفة 🌿 حلّي كل يوم:</div><a class="pl-t dly" href="#daily"><span class="ck"></span><span class="en">🔥 Daily Challenge</span></a><a class="pl-t" href="#words"><span class="ck"></span><span class="en">📒 My Words</span></a></div></div>`; }
    const d = g.list[0];
    const isT = d.d === t, lateHere = isT ? overdue : [];
    const list = lateHere.map(x => chip(x, true)).concat(d.t.map(x => chip(x)));
    const rev = d.rev ? `<div class="pl-rv">🎯 يوم المراجعة</div><a class="pl-t rev${mockOn(d.d) ? ' ok' : ''}" href="#mock"><span class="ck">${mockOn(d.d) ? '✓' : ''}</span><span class="en">📝 Mock Test</span></a><a class="pl-t rev" href="#rev"><span class="ck"></span><span class="en">🔁 Revision</span></a>` : '';
    const light = !list.length && !d.rev ? '<div class="pl-light">يوم خفيف 🌿</div>' : '';
    const dly = `<a class="pl-t dly${dailyDoneOn(d.d) ? ' ok' : ''}" href="#daily"><span class="ck">${dailyDoneOn(d.d) ? '✓' : ''}</span><span class="en">🔥 Daily Challenge</span></a>`;
    const dd = `<div class="pl-dd"><b>${AR_DAYS[bdDate(d.d).getDay()]}</b><span>${bdSlash(d.d)}</span>${isT ? '<span class="pl-now">اليوم</span>' : ''}</div>`;
    if (!isT && !d.rev && d.t.length > 3) {
      const dn = d.t.filter(planTaskDone).length;
      return `<details class="pl-dayf"><summary class="pl-day">${dd}<div class="pl-ts"><span class="pl-cnt">${arCount(d.t.length, 'مهمة وحدة', 'مهمتين', 'مهام', 'مهمة')}${dn ? ` · ${dn} ✓` : ''}</span><span class="pl-arw">▾</span></div></summary><div class="pl-day pl-in"><div class="pl-dd"></div><div class="pl-ts">${list.join('')}${dly}</div></div></details>`;
    }
    return `<div class="pl-day${isT ? ' today' : ''}">${dd}<div class="pl-ts">${rev}${list.join('')}${light}${dly}</div></div>`;
  }).join('');
  const examRow = `<div class="pl-day"><div class="pl-dd"><b>${AR_DAYS[bdDate(nx.date).getDay()]}</b><span>${bdSlash(nx.date)}</span>${bdDays(nx.date) === 0 ? '<span class="pl-now">اليوم</span>' : ''}</div><div class="pl-ts"><div class="pl-ex">📝 ${escHTML(nx.title)} · بالتوفيق 🤍</div></div></div>`;
  return `<div class="plan"><div class="pl-top"><div><div class="pl-h">📋 خطة مذاكرتك: ${escHTML(nx.title)}</div><div class="pl-s">${unitsText(nx)} · ${planDesc(nx)}. المهمة تنشطب ✓ لما تخلّصين تمارينها بدرجة ٧٠٪ أو أكثر.</div></div>${all.length ? `<div class="pl-pc"><b>${doneN}/${all.length}</b><small>مهمة</small></div>` : ''}</div>
    ${all.length ? '' : '<div class="pl-great">ممتاز! خلّصتي كل الأجزاء المطلوبة 👏 ثبّتي معلوماتك بـ Mock Test و Daily Challenge.</div>'}
    ${rows}${examRow}${all.length - doneN ? '<button class="pl-re" type="button">↻ وزّعي المتبقي من جديد</button>' : ''}</div>`;
}

let tourEl = null, TSTEPS = [], TOURI = 0, tourCur = null;
function startTour() {
  if ((location.hash || '#home') !== '#home') { location.hash = '#home'; setTimeout(startTour, 350); return; }
  endTour(false);
  TSTEPS = TOUR.filter(s => { if (!s.t) return true; const e = s.t(); return !!(e && e.getClientRects().length); });
  tourEl = h('div', { class: 'tour', role: 'dialog', 'aria-label': 'جولة تعريفية' }, `<div class="tour-hole"></div><div class="tour-tip"><div class="tt-dots">${TSTEPS.map(() => '<i></i>').join('')}</div><h3></h3><p></p><div class="tt-b"><button class="btn c sm tt-next" type="button"></button><button class="btn ghost sm tt-prev" type="button">السابق</button><span style="flex:1"></span><button class="btn ghost sm tt-skip" type="button">تخطي</button></div></div>`);
  document.body.appendChild(tourEl);
  $('.tt-skip', tourEl).onclick = () => endTour(true);
  $('.tt-prev', tourEl).onclick = () => tourGo(TOURI - 1);
  $('.tt-next', tourEl).onclick = () => tourGo(TOURI + 1);
  window.addEventListener('resize', tourPlace); window.addEventListener('scroll', tourPlace, { passive: true });
  document.addEventListener('keydown', tourKey);
  tourGo(0);
}
function tourKey(e) { if (!tourEl) return; if (e.key === 'Escape') endTour(true); else if (e.key === 'ArrowLeft') tourGo(TOURI + 1); else if (e.key === 'ArrowRight') tourGo(TOURI - 1); }
function tourGo(i) {
  if (!tourEl || i < 0) return;
  if (i >= TSTEPS.length) { endTour(true); return; }
  TOURI = i; const s = TSTEPS[i], last = i === TSTEPS.length - 1;
  const nm = ((Store.mem.student && Store.mem.student.name) || '').trim().split(/\s+/)[0] || '';
  $('h3', tourEl).textContent = s.h.replace(' {name}', nm ? ' ' + nm : '');
  $('p', tourEl).textContent = s.p;
  $$('.tt-dots i', tourEl).forEach((d, k) => d.classList.toggle('on', k === i));
  $('.tt-prev', tourEl).classList.toggle('hide', !i);
  $('.tt-skip', tourEl).classList.toggle('hide', last);
  $('.tt-next', tourEl).textContent = last ? 'يلا نبدأ ✓' : i === 0 ? 'ابدئي الجولة ←' : 'التالي ←';
  tourCur = s.t ? s.t() : null;
  if (tourCur && !tourCur.closest('.top')) tourCur.scrollIntoView({ block: 'center' });
  else if (!tourCur && i === 0) window.scrollTo(0, 0);
  requestAnimationFrame(tourPlace);
}
function tourPlace() {
  if (!tourEl) return;
  const hole = $('.tour-hole', tourEl), tip = $('.tour-tip', tourEl);
  const W = innerWidth, H = innerHeight, tw = Math.min(360, W - 24);
  tip.style.width = tw + 'px';
  const th = tip.offsetHeight;
  if (!tourCur || !tourCur.isConnected) {
    hole.className = 'tour-hole none'; hole.style.cssText = `left:${W / 2}px;top:${H / 2}px;width:0;height:0`;
    tip.style.left = (W - tw) / 2 + 'px'; tip.style.top = Math.max(12, (H - th) / 2) + 'px'; return;
  }
  const r = tourCur.getBoundingClientRect(), p = 6;
  hole.className = 'tour-hole';
  hole.style.cssText = `left:${r.left - p}px;top:${r.top - p}px;width:${r.width + 2 * p}px;height:${r.height + 2 * p}px`;
  let top = r.bottom + p + 12;
  if (top + th > H - 12) top = r.top - p - 12 - th;
  if (top < 12) top = Math.max(12, H - th - 12);
  const left = Math.max(12, Math.min(W - tw - 12, r.left + r.width / 2 - tw / 2));
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function endTour(done) {
  if (tourEl) { tourEl.remove(); tourEl = null; }
  window.removeEventListener('resize', tourPlace); window.removeEventListener('scroll', tourPlace);
  document.removeEventListener('keydown', tourKey);
  tourCur = null;
  if (done) { Store.mem.toured = true; Store.save(); }
}


/* ---------- automatic progress tracking: Google Form → Google Sheet ---------- */
const Track = {
  cfg: null, tm: null,
  parse() {
    if (this.cfg !== null) return this.cfg;
    this.cfg = false;
    const link = String(COURSE.trackForm || '').trim(); if (!link) return false;
    try {
      const u = new URL(link), m = u.pathname.match(/\/forms\/d\/e\/([^/]+)\//); if (!m) return false;
      const f = {};
      u.searchParams.forEach((v, k) => { if (/^entry\.\d+$/.test(k)) f[v.trim().toLowerCase()] = k; });
      if (f.name && f.sid) this.cfg = { url: `https://docs.google.com/forms/d/e/${m[1]}/formResponse`, f };
    } catch (e) {}
    return this.cfg;
  },
  on() { return !!this.parse(); },
  mark() {
    if (!this.on() || !Store.mem.student || Store.mem.role === 'teacher') return;
    Store.mem.trackDirty = true; Store.save();
    clearTimeout(this.tm); this.tm = setTimeout(() => this.flush(), 90000);
  },
  detail() {
    const parts = UNITS.map(u => { const s = unitStats(u); return `${u.part ? u.short : 'Rev'}: ${s.done}/${s.total}${s.avg !== null ? ' (' + s.avg + '%)' : ''}`; });
    const extra = [], mh = Store.mem.mockHist || [], D = Store.mem.daily;
    if (mh.length) extra.push(`Mock best ${Math.max(...mh.map(x => x.s))}% (${mh.length} tries)`);
    if (D && D.days && Object.keys(D.days).length) extra.push(`Daily: ${Object.keys(D.days).length} days, streak ${dailyStreak()}`);
    const wc = wordsCount(); if (wc) extra.push(`Words to review: ${wc}`);
    return parts.join(' | ') + (extra.length ? ' || ' + extra.join(' · ') : '');
  },
  sendWriting(title, text) {
    const c = this.parse(), st = Store.mem.student;
    if (!c || !c.f.writing || !st || Store.mem.role === 'teacher') return;
    const v = { name: st.name, sid: st.sid, sec: st.sec || '-', pct: overall() + '%', detail: this.detail(), writing: `${title}: ${text}` };
    const body = new URLSearchParams(); Object.entries(c.f).forEach(([k, e]) => { if (v[k] !== undefined) body.append(e, v[k]); });
    body.append('fvv', '1'); body.append('pageHistory', '0');
    try { if (!(navigator.sendBeacon && navigator.sendBeacon(c.url, body))) fetch(c.url, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {}); } catch (e) {}
    Store.mem.trackDirty = false; Store.save();
  },
  flush(force) {
    clearTimeout(this.tm);
    const c = this.parse(), st = Store.mem.student;
    if (!c || !st || Store.mem.role === 'teacher') return false;
    if (!force && !Store.mem.trackDirty) return false;
    const v = { name: st.name, sid: st.sid, sec: st.sec || '-', pct: overall() + '%', detail: this.detail() };
    const body = new URLSearchParams();
    Object.entries(c.f).forEach(([k, e]) => { if (v[k] !== undefined) body.append(e, v[k]); });
    body.append('fvv', '1'); body.append('pageHistory', '0');
    let ok = false;
    try { ok = !!(navigator.sendBeacon && navigator.sendBeacon(c.url, body)); } catch (e) {}
    if (!ok) { try { fetch(c.url, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {}); ok = true; } catch (e) {} }
    if (ok) { Store.mem.trackDirty = false; Store.mem.trackSent = Date.now(); Store.save(); }
    return ok;
  }
};
